<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Validasi Surat Cuti UNDIKMA</title>
    <style>
        /* CSS untuk memastikan iframe mengisi seluruh viewport */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Mencegah scroll di halaman utama */
        }
        #gas-iframe {
            border: none;
            width: 100%;
            height: 100vh; /* Menggunakan tinggi viewport penuh */
            display: block;
        }
    </style>
</head>
<body>

    <iframe id="gas-iframe" src="" title="Validasi Cuti Mahasiswa"></iframe>

    <script>
        // 1. Ganti BASE_GAS_URL dengan URL deployment GAS Anda.
        const BASE_GAS_URL = "https://script.google.com/macros/s/AKfycbxdnyM_5dTBj7L_VtALD_M1k7JxRJCVlTlG-163WfGqGThDwdon5agqp-KSfX_910SNOA/exec"; 
        
        const iframe = document.getElementById('gas-iframe');
        
        // Fungsi untuk mendapatkan parameter 'idSurat' dari URL halaman GitHub Pages.
        function getQueryParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Ambil nilai idSurat dari URL GitHub Pages
        const idSurat = getQueryParameter('idSurat');

        // 2. Buat URL final yang akan dimuat di iframe.
        let finalUrl = BASE_GAS_URL;

        if (idSurat) {
            // Jika idSurat ada di URL GitHub Pages, tambahkan ke URL GAS.
            finalUrl += `?idSurat=${encodeURIComponent(idSurat)}`;
        } else {
            // Jika tidak ada idSurat, tampilkan pesan error bawaan dari GAS 
            // (karena doGet Anda akan mengembalikan "ID Surat tidak ditemukan").
            // Atau, Anda bisa mengarahkan ke halaman default BASE_GAS_URL
        }

        // 3. Muat URL GAS ke dalam iframe
        iframe.src = finalUrl;
    </script>
</body>
</html>

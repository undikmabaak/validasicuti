<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Validasi Surat Cuti UNDIKMA</title>
    <style>
        /* CSS untuk memastikan iframe mengisi seluruh viewport */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Mencegah scroll di halaman utama */
        }
        #gas-iframe {
            border: none;
            width: 100%;
            height: 100vh; /* Menggunakan tinggi viewport penuh */
            display: block;
        }
    </style>
</head>
<body>

    <iframe id="gas-iframe" src="" title="Validasi Cuti Mahasiswa"></iframe>

    <script>
    // 1. Ganti BASE_GAS_URL dengan URL deployment GAS Anda yang sebenarnya!
    const BASE_GAS_URL = "https://script.google.com/a/macros/undikma.ac.id/s/AKfycbxdnyM_5dTBj7L_VtALD_M1k7JxRJCVlTlG-163WfGqGThDwdon5agqp-KSfX_910SNOA/exec"; 
    
    const iframe = document.getElementById('gas-iframe');
    
    function getQueryParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    const idSurat = getQueryParameter('idSurat');
    // Jika ada parameter tambahan (kepalaBaak, nik), Anda harus mengambilnya di sini:
    // const kepalaBaak = getQueryParameter('kepalaBaak');
    
    let finalUrl = BASE_GAS_URL;

    // Pastikan semua parameter diteruskan
    if (window.location.search) {
        finalUrl += window.location.search; 
    }

    iframe.src = finalUrl;
</script>
</body>
</html>
